<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OMNIX</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">O</div>

            <div>
                <h1>OMNIX</h1>
                <span>AI 1.0</span>
            </div>
        </div>

        <div class="status">
            <span></span>
            Online
        </div>
    </header>


    <main
        id="messages"
        class="messages"
    >

        <div class="welcome">

            <h2>Welcome to OMNIX</h2>

            <p>
                An experimental AI built from scratch.
            </p>

        </div>

    </main>


    <div class="composer">

        <textarea
            id="messageInput"
            placeholder="Message OMNIX..."
            rows="1"
        ></textarea>

        <button id="sendButton">
            Send
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
                       </html>
